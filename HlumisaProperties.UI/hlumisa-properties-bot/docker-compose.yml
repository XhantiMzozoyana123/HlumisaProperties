version: '3.8'

services:
  messenger-bot:
    build: .
    container_name: hlumisa-messenger-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - FACEBOOK_PAGE_ACCESS_TOKEN
      - FACEBOOK_PAGE_ID
      - FACEBOOK_VERIFY_TOKEN
      - LLM_BASE_URL
      - LLM_MODEL
      - MESSENGER_BOT_PORT=3001
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:3001/health',res=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
